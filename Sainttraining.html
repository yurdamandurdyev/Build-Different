</style></head><body><div id="app"></div><script>function calculate({weight,height,age,sex,activity,goal}) {
 if (![weight,height,age,activity].every(Number.isFinite)||weight<30||weight>300||height<120||height>230||age<18||age>85||!['male','female'].includes(sex)||![1.2,1.375,1.55,1.725].includes(activity)||!['lose','maintain','gain'].includes(goal)) throw new Error('Проверьте данные: расчёт для взрослых 18–85 лет.');
 const calories=Math.round((10*weight+6.25*height-5*age+(sex==='male'?5:-161))*activity*({lose:.85,maintain:1,gain:1.1}[goal]));
 const protein=Math.round(weight*1.6),fat=Math.round(calories*.3/9),carbs=Math.round((calories-protein*4-fat*9)/4);return {calories,protein,fat,carbs};
}

const tips=[['Приседания','Стопы примерно на ширине плеч. Опирайся на всю стопу, направляй колени по линии носков. Опускайся до комфортной глубины, сохраняя контроль спины. Начни без дополнительного веса.'],['Отжимания','Ладони чуть шире плеч. Держи корпус ровно. Локти направляй под углом примерно 30–45° к корпусу. Если тяжело, поставь руки на устойчивую высокую опору.'],['Румынская тяга','Слегка согни колени и отводи таз назад, удерживая вес близко к ногам. Сохраняй нейтральное положение спины. Не опускайся ниже точки, где спина начинает округляться. Начни с лёгкого веса.'],['Восстановление','Оставляй день отдыха между тяжёлыми тренировками одной группы мышц. Спи 7–9 часов. Повышай нагрузку постепенно. При острой боли, головокружении или боли в груди прекрати занятие и обратись за помощью.']];

document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b===button);b.setAttribute('aria-pressed',String(b===button));});document.querySelectorAll('[data-type]').forEach(c=>c.hidden=button.dataset.filter!=='all'&&c.dataset.type!==button.dataset.filter);});
document.querySelectorAll('[data-program]').forEach(button=>button.onclick=()=>{const p=programs[Number(button.dataset.program)];openDetail(`<span class="eyebrow">${p.tag} / ${p.meta}</span><h2>${p.name}</h2><p>${p.desc}</p><h3>Пример тренировочного дня</h3><ol>${p.work.map(w=>`<li>${w}</li>`).join('')}</ol><p>Разминка — 5–7 минут. Отдых между подходами — 60–90 секунд. Сохраняй комфортную интенсивность и прекращай упражнение при боли.</p><button class="button dark" id="save-program">Сохранить программу ＋</button><p id="save-status" role="status"></p>`,button);document.querySelector('#save-program').onclick=()=>{try{localStorage.setItem('sainttraining-program',p.name);document.querySelector('#save-status').textContent='Сохранено в этом браузере';showSaved();}catch{document.querySelector('#save-status').textContent='Браузер запретил сохранение.';}};});
document.querySelectorAll('[data-recipe]').forEach(button=>button.onclick=()=>{const r=recipes[Number(button.dataset.recipe)];openDetail(`<span class="eyebrow">РЕЦЕПТ / ${r.time}</span><h2>${r.name}</h2><p>≈ ${r.kcal} ккал · Б ${r.p} г · Ж ${r.f} г · У ${r.c} г</p><h3>Ингредиенты на порцию</h3><p>${r.ingredients}</p><h3>Как приготовить</h3><p>${r.steps}</p><p class="footnote">Учитывай аллергию и непереносимость. Для точного расчёта используй данные с упаковок.</p>`,button);});
document.querySelector('.close-dialog').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});dialog.addEventListener('close',()=>trigger?.focus());
document.querySelector('#calc-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),out=document.querySelector('#calc-result');try{const goal=f.get('goal'),r=calculate({sex:f.get('sex'),goal,weight:Number(f.get('weight')),height:Number(f.get('height')),age:Number(f.get('age')),activity:Number(f.get('activity'))});out.innerHTML=`<span class="eyebrow">ТВОЙ ДНЕВНОЙ ОРИЕНТИР</span><div class="calories">${r.calories}<small>ккал / день</small></div><div class="macros"><div><b>${r.protein} г</b><span>Белки</span></div><div><b>${r.fat} г</b><span>Жиры</span></div><div><b>${r.carbs} г</b><span>Углеводы</span></div></div><p>${goal==='lose'?'Умеренный дефицит 15%. Следи за восстановлением.':goal==='gain'?'Профицит 10%. Постепенно увеличивай силовую нагрузку.':'Поддерживай привычную активность.'} Корректируй ориентир по самочувствию и динамике за 2–3 недели.</p>`;}catch(err){out.textContent=err.message;}};
</script></body></html>
